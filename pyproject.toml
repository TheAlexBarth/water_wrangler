[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "water_wrangler"
version = "0.1.0"
description = "BAYCAST xarray wrapper and visualization utilities for SCHISM outputs"
readme = "README.md"
requires-python = ">=3.9"

authors = [
  { name = "Dr. Alex Barth" }
]

license = { text = "MIT3.0" }

dependencies = [
  "numpy>=1.23",
  "xarray>=2023.1.0",
  "pandas>=1.5",
  "scipy>=1.9",
  "matplotlib>=3.6",
  "cmocean>=3.0",
  "rasterio>=1.3",
]

[project.optional-dependencies]
dev = [
  "ipykernel",
  "pytest",
  "black",
  "ruff",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cc.data" = [
  "*.tif",
  "*.nc"
]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I"]
ignore = ["E501"]